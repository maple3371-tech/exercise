<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="운동 인증">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>운동 인증</title>
<style>
:root{
  --bg:#06070a;--s1:#0d1016;--s2:#141922;--s3:#1c2330;--ln:#1e2531;
  --tx:#f3f5f8;--mut:#8a94a6;--dim:#566074;
  --bl:#3b82f6;--bl2:#7db8ff;--red:#ff6b6b;
  --r:20px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;overscroll-behavior-y:none}
body:before{content:"";position:fixed;inset:0 0 auto 0;height:340px;background:radial-gradient(60% 100% at 80% 0,rgba(59,130,246,.16),transparent 70%);pointer-events:none}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;outline:0}
button{cursor:pointer}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#app{position:relative;max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(var(--st) + 0px) 18px calc(var(--sb) + 104px)}

/* header */
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;margin:0 -18px;padding:calc(var(--st) + 14px) 18px 12px;background:linear-gradient(var(--bg) 70%,transparent)}
#app{padding-top:0}
.hd-t{flex:1;min-width:0}
.hd-t small{display:block;color:var(--mut);font-size:12.5px}
.hd-t h1{font-size:23px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:42px;height:42px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none}
.ib .dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bl);font-size:11px;font-weight:700;line-height:18px;text-align:center;border:2px solid var(--bg);box-sizing:content-box}
.av{--c:var(--bl);width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#0d1016);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,transparent)}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av.lg{width:42px;height:42px;font-size:16px}
.av.xl{width:68px;height:68px;font-size:26px}
.av.sm{width:28px;height:28px;font-size:12px}

/* blocks */
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin-top:12px}
.lbl{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 0;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.01em}
.lbl button{color:var(--bl2);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;background:var(--s3);font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap}
.chip.b{background:rgba(59,130,246,.16);color:var(--bl2)}
.chip.r{background:rgba(255,107,107,.13);color:var(--red)}
.chip.w{background:rgba(255,255,255,.1);color:var(--tx)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:15px;background:linear-gradient(135deg,#2f6fee,#5aa2ff);color:#fff;font-weight:700;font-size:15px}
.btn:disabled{opacity:.45}
.btn.g{background:var(--s3);color:var(--tx)}
.btn.s{flex:none;white-space:nowrap;height:40px;border-radius:12px;font-size:14px;width:auto;padding:0 16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:12.5px}
.empty{color:var(--dim);text-align:center;padding:34px 0;font-size:14px}
.strip{margin-top:6px;padding:9px 14px;border-radius:12px;background:rgba(59,130,246,.1);color:var(--bl2);font-size:12.5px;text-align:center}

/* hero */
.hero{display:flex;align-items:center;gap:18px;background:linear-gradient(150deg,#111827,#0b0e14 60%);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;border:34px solid rgba(59,130,246,.09);pointer-events:none}
.ring{position:relative;width:124px;height:124px;flex:none}
.ring svg{width:124px;height:124px;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:32px;font-weight:700;line-height:1}
.ring b i{font-style:normal;font-size:16px;color:var(--mut);font-weight:600}
.ring span{font-size:11.5px;color:var(--mut);margin-top:4px}
.hero h2{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:8px 0 2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:15px 16px;margin-top:12px;text-align:left;display:block;width:100%}
.tile small{display:block;color:var(--mut);font-size:12px;margin-bottom:6px}
.tile b{font-size:20px;font-weight:700}
.tile em{display:block;font-style:normal;font-size:11.5px;color:var(--dim);margin-top:3px}
.tile.warn b,.red{color:var(--red)}
.blue{color:var(--bl2)}

/* approvals */
.apv{border-color:rgba(59,130,246,.55);background:linear-gradient(160deg,rgba(59,130,246,.14),var(--s1) 55%)}
.apv p{margin:10px 0 14px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* member rows */
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.mrow:first-child{border-top:0;padding-top:0}.mrow:last-child{padding-bottom:0}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:18px;height:6px;border-radius:3px;background:var(--s3)}
.dots i.on{background:linear-gradient(90deg,var(--bl),var(--bl2))}
.th{width:52px;height:52px;border-radius:13px;object-fit:cover;background:var(--s3);flex:none}

/* feed */
.wk{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.wk .ib:disabled{opacity:.3}
.wk b{display:block;text-align:center;font-size:16px}
.wk span{display:block;text-align:center;font-size:12px;color:var(--mut)}
.post{padding:0;overflow:hidden;display:block;width:100%;text-align:left}
.post .ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--s3)}
.post .pb{padding:14px 16px}
.post p{margin-top:10px;font-size:14.5px;word-break:break-word}
.pf{display:flex;align-items:center;gap:6px;margin-top:12px;color:var(--mut);font-size:13px}
.pf .ic{width:17px;height:17px}

/* charts */
.seg{display:flex;gap:8px;overflow-x:auto;margin:6px -18px 0;padding:0 18px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:36px;padding:0 15px;border-radius:18px;background:var(--s2);color:var(--mut);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--tx);color:#06070a}
.bars{display:flex;align-items:flex-end;gap:8px;height:168px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars u{display:block;width:100%;max-width:26px;border-radius:8px 8px 3px 3px;background:var(--s3);text-decoration:none}
.bars .cur u{background:linear-gradient(180deg,var(--bl2),var(--bl));box-shadow:0 0 22px rgba(59,130,246,.45)}
.bars s{text-decoration:none;font-size:10.5px;color:var(--mut);margin-bottom:6px;white-space:nowrap}
.bars .cur s{color:var(--tx);font-weight:700}
.bars em{font-style:normal;font-size:10.5px;color:var(--dim);margin-top:8px;white-space:nowrap}
.hb{height:8px;border-radius:4px;background:var(--s3);margin-top:7px;overflow:hidden}
.hb i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--bl),var(--bl2))}

/* fines */
.big{font-size:36px;font-weight:700;line-height:1.1;margin:6px 0 12px}
.big small{font-size:18px;font-weight:600;color:var(--mut);margin-left:2px}
.fi{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--ln)}
.fi:first-child{border-top:0;padding-top:0}.fi:last-child{padding-bottom:0}
.ex p{margin:10px 0 12px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}

/* nav */
.nav{position:fixed;z-index:10;left:50%;bottom:calc(var(--sb) + 14px);transform:translateX(-50%);width:min(444px,calc(100% - 28px));height:66px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:rgba(17,21,29,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:26px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:10.5px;font-weight:600}
.nav button.on{color:var(--tx)}
.nav .fab{width:52px;height:52px;border-radius:19px;margin:0 auto;background:linear-gradient(135deg,#2f6fee,#6aaeff);color:#fff;justify-content:center;box-shadow:0 8px 24px rgba(59,130,246,.45)}
.nav .fab .ic{width:26px;height:26px;stroke-width:2}

/* sheets */
.bd{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62);animation:fd .18s}
.sh{position:fixed;z-index:21;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;max-height:92dvh;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--ln);border-bottom:0;border-radius:26px 26px 0 0;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sh.full{height:92dvh}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px;flex:none}
.sh-h h3{font-size:18px;font-weight:700;letter-spacing:-.02em}
.sh-b{padding:8px 18px 22px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sh-f{flex:none;padding:10px 14px calc(var(--sb) + 12px);border-top:1px solid var(--ln)}
.sh:not(:has(.sh-f)) .sh-b{padding-bottom:calc(var(--sb) + 22px)}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
@keyframes fd{from{opacity:0}}
.fld{display:block;margin-top:18px}
.fld>span{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:8px}
.inp{width:100%;height:50px;border-radius:14px;background:var(--s2);border:1px solid var(--ln);padding:0 15px;font-size:16px}
textarea.inp{height:96px;padding:13px 15px;resize:none}
.inp:focus{border-color:var(--bl)}
.pick{display:grid;place-items:center;width:100%;aspect-ratio:4/3;border-radius:18px;background:var(--s2);border:1.5px dashed #2b3445;color:var(--mut);overflow:hidden;cursor:pointer;font-size:13.5px;gap:8px;text-align:center}
.pick img{width:100%;height:100%;object-fit:cover}
.pick .ic{width:30px;height:30px;margin:0 auto 8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{height:54px;border-radius:13px;background:var(--s2);border:1px solid var(--ln);font-size:11.5px;color:var(--mut);line-height:1.35}
.days button b{display:block;font-size:15px;color:var(--tx)}
.days button.on{background:var(--bl);border-color:var(--bl);color:#dbeafe}
.days button:disabled{opacity:.3}
.dur{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dur label{position:relative}
.dur .inp{padding-right:48px;text-align:right;font-size:20px;font-weight:700}
.dur em{position:absolute;right:15px;top:14px;font-style:normal;color:var(--mut);font-size:14px}
.full-ph{display:block;width:100%;border-radius:16px;background:var(--s3);min-height:120px}
.cm{display:flex;gap:10px;margin-top:16px}
.cm.rp{margin-left:38px}
.cm-h{display:flex;gap:8px;align-items:baseline;font-size:13px}.cm-h span{color:var(--dim);font-size:11.5px}
.cm p{font-size:14.5px;white-space:pre-wrap;word-break:break-word;margin-top:1px}
.cm-a{display:flex;gap:14px;margin-top:4px}.cm-a button{font-size:12px;color:var(--mut);font-weight:600}
.send{display:flex;gap:8px;align-items:center}
.send .inp{height:46px;border-radius:23px}
.send button{width:46px;height:46px;border-radius:50%;background:var(--bl);display:grid;place-items:center;flex:none}
.rpl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--bl2);padding:0 6px 8px}
.nt{display:flex;gap:12px;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--ln)}
.nt:first-child{border-top:0}
.nt p{font-size:14px}.nt .grow span{font-size:12.5px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt.new p:after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bl);margin-left:7px;vertical-align:middle}
.in{display:flex;gap:14px;align-items:flex-start;margin-top:18px}
.in>i{width:40px;height:40px;border-radius:13px;background:rgba(59,130,246,.14);color:var(--bl2);display:grid;place-items:center;flex:none}
.in b{display:block;font-size:14.5px}.in span{font-size:13px;color:var(--mut)}
.dlg{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,calc(100% - 48px));background:var(--s2);border:1px solid var(--ln);border-radius:22px;padding:22px 18px 18px;text-align:center}
.dlg p{margin-bottom:18px;font-size:15px}
.bd.top{z-index:30}
#toast{position:fixed;z-index:40;left:50%;bottom:calc(var(--sb) + 96px);transform:translateX(-50%);background:var(--tx);color:#06070a;padding:10px 16px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:90%}
#toast.on{opacity:1}
.gate{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 24px) 6px 40px}
.gate h1{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.gate>p{color:var(--mut);margin-top:8px}
.mp{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:16px;background:var(--s1);border:1px solid var(--ln);margin-top:10px;text-align:left;font-weight:600}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--bl);animation:sp .8s linear infinite;margin:45dvh auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="sheet"></div>
<div id="dlg"></div>
<div id="toast"></div>
<input type="file" id="f-pay" accept="image/*" hidden>
<script src="config.js"></script>
<script>
(() => {
'use strict';
const C = Object.assign({firebase:{},startDate:'2026-11-16',prepQuotas:[1,2],weeklyQuota:3,fines:[0,5000,10000,20000],monthlyFreeMisses:3,freeMissesWaiveFine:true,maxMembers:4}, window.APP_CONFIG||{});
const DEMO = !(C.firebase && C.firebase.apiKey);

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const mem = {};
const LS = {
  get(k){ try{ const v=localStorage.getItem(k); return v===null ? (k in mem?mem[k]:null) : v; }catch(e){ return k in mem?mem[k]:null; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); };
const addDays = (d,n) => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
const monday = d => addDays(d, -((d.getDay()+6)%7));
const md = d => `${d.getMonth()+1}.${d.getDate()}`;
const DOW = ['월','화','수','목','금','토','일'];
const dow = d => DOW[(d.getDay()+6)%7];
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const won = n => n.toLocaleString('ko-KR');
const fmtMin = m => { const h=Math.floor(m/60), r=m%60; return h ? (r?`${h}시간 ${r}분`:`${h}시간`) : `${r}분`; };
const fmtShort = m => `${Math.floor(m/60)}:${pad(m%60)}`;
const ago = t => { const s=(Date.now()-t)/1000; if(s<60) return '방금'; if(s<3600) return `${Math.floor(s/60)}분 전`; if(s<86400) return `${Math.floor(s/3600)}시간 전`; if(s<604800) return `${Math.floor(s/86400)}일 전`; return md(new Date(t)); };
const COLORS = ['#5b9dff','#8be0ff','#b4b9ff','#e8ebf0'];
const ico = (p,c='') => `<svg class="ic ${c}" viewBox="0 0 24 24">${p}</svg>`;
const I = {
  home: ico('<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>'),
  feed: ico('<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M4 16l4.5-4.5 4 4 2.5-2.5 5 5"/><circle cx="15" cy="9" r="1.3"/>'),
  chart: ico('<path d="M5 20v-8M12 20V5M19 20v-5"/>'),
  coin: ico('<circle cx="12" cy="12" r="8.5"/><path d="M8.5 9l1.6 6.2L12 10l1.9 5.2L15.5 9M8 12h8"/>'),
  bell: ico('<path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2.2 2.2 0 0 0 4 0"/>'),
  plus: ico('<path d="M12 5v14M5 12h14"/>'),
  x: ico('<path d="M6 6l12 12M18 6L6 18"/>'),
  l: ico('<path d="M14.5 6l-6 6 6 6"/>'),
  r: ico('<path d="M9.5 6l6 6-6 6"/>'),
  cam: ico('<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/>'),
  chat: ico('<path d="M5 5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-4 3v-3H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>'),
  send: ico('<path d="M5 12h13M12 6l6 6-6 6"/>'),
  check: ico('<path d="M5 12.5l4.5 4.5L19 7"/>'),
  cal: ico('<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/>'),
  user: ico('<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>')
};
let toastT;
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); };
function ask(msg, ok='확인'){
  return new Promise(res => {
    const d=$('#dlg');
    d.innerHTML = `<div class="bd top"></div><div class="dlg"><p>${esc(msg)}</p><div class="two"><button class="btn g s" data-x="0">취소</button><button class="btn s" data-x="1">${esc(ok)}</button></div></div>`;
    d.onclick = e => { const b=e.target.closest('[data-x]'); if(!b && !e.target.classList.contains('bd')) return; d.innerHTML=''; d.onclick=null; res(!!b && b.dataset.x==='1'); };
  });
}
function compress(file, max=1280){
  return new Promise((res,rej) => {
    const url=URL.createObjectURL(file), img=new Image();
    img.onload = () => {
      const s=Math.min(1, max/Math.max(img.width,img.height)), w=Math.round(img.width*s), h=Math.round(img.height*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);

function exStatus(e){
  const others=S.members.filter(m=>m.id!==e.memberId), v=e.votes||{};
  if(others.some(o=>v[o.id] && v[o.id].v==='no')) return 'rejected';
  if(others.length && others.every(o=>v[o.id] && v[o.id].v==='ok')) return 'approved';
  return 'pending';
}
function weekStat(mid, i){
  const ws=weekStart(i), base=baseQuota(i);
  const apv=S.excuses.filter(e=>e.memberId===mid && exStatus(e)==='approved');
  let exDays=0;
  for(let k=0;k<7;k++){ const d=ymd(addDays(ws,k)); if(apv.some(e=>e.from<=d && d<=e.to)) exDays++; }
  const q=Math.round(base*(7-exDays)/7);
  const ps=S.posts.filter(p=>p.memberId===mid && weekIndex(parse(p.date))===i);
  const minutes=ps.reduce((a,p)=>a+(p.minutes||0),0);
  return { i, base, q, exDays, count:ps.length, minutes, miss:Math.max(0,q-ps.length), ended:i<curIdx() };
}
const firstIdx = m => Math.max(0, weekIndex(new Date(m.createdAt||0)));
function fineItems(){
  const out=[], cur=curIdx();
  for(const m of S.members){
    const free={};
    for(let i=firstIdx(m); i<cur; i++){
      const st=weekStat(m.id,i); if(!st.miss) continue;
      let charged=st.miss;
      if(C.freeMissesWaiveFine){ const ws=weekStart(i), mk=ws.getFullYear()+'-'+ws.getMonth(), used=free[mk]||0, f=Math.min(charged, Math.max(0,C.monthlyFreeMisses-used)); free[mk]=used+f; charged-=f; }
      const amount=C.fines[Math.min(charged, C.fines.length-1)]||0; if(!amount) continue;
      const key=m.id+'_'+i;
      out.push({ key, memberId:m.id, i, miss:st.miss, amount, pay:S.payments.find(p=>p.id===key) });
    }
  }
  return out.sort((a,b)=>b.i-a.i);
}
function monthMiss(mid){
  const m=M(mid), now=today(), cur=curIdx(); let n=0;
  for(let i=firstIdx(m); i<cur; i++){ const ws=weekStart(i); if(ws.getFullYear()===now.getFullYear() && ws.getMonth()===now.getMonth()) n+=weekStat(mid,i).miss; }
  return n;
}

function localDB(){

  return {

async function fbDB(){

  const [AP,AU,F]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);

  catch(e){ fs=F.getFirestore(app); }
  let me;
  return {
    async init(){
      await auth.authStateReady();
      me = auth.currentUser || (await AU.signInAnonymously(auth)).user;
      let ok=false;

      return {needCode:!ok};
    },

    set(c,id,v){ return F.setDoc(F.doc(fs,c,id),v); },

}

function squareThumb(file, n=192){
  return new Promise((res,rej) => {
    const url=URL.createObjectURL(file), im=new Image();
    im.onload = () => { const s=Math.min(im.width,im.height), c=document.createElement('canvas'); c.width=c.height=n;
      c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,n,n); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.82)); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    im.src=url;
  });
}

  if(S.sheet && S.sheet.type==='set') shSettings();
  toast('프로필 사진을 바꿨습니다');
}));
document.addEventListener('change', async e => {
  if(e.target.id!=='f-post') return;
  const f=e.target.files[0]; if(!f) return;
  try{ U.photo=await compress(f); const pk=$('#u-pick'); const old=pk.querySelector('img,div'); if(old) old.remove(); pk.insertAdjacentHTML('beforeend',`<img src="${U.photo}" alt="">`); }
  catch(err){ toast('사진을 불러오지 못했습니다'); }
});
document.addEventListener('click', e => {
  const el=e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const p=el.dataset.a.split(':'), fn=A[p[0]]; if(fn) fn(...p.slice(1), el);
});
document.addEventListener('keydown', e => { if(e.key==='Enter' && !e.isComposing){ if(e.target.id==='c-in') A['cmt-send'](); if(e.target.id==='g-code') A['code-join'](); if(e.target.id==='g-name') A['member-new'](); } });
document.addEventListener('visibilitychange', () => { if(!document.hidden && S.me && !S.sheet) render(); });

/* ---------- boot ---------- */
(async () => {
  try{
    DB = DEMO ? localDB() : await fbDB();
    const r=await DB.init();
    if(r.needCode) gateCode(); else start();
    if(!DEMO && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  }catch(e){
    console.error(e);
    $('#app').innerHTML=`<div class="gate"><h1>연결 실패</h1><p>${esc(e.code||e.message||'')}</p><p>config.js 와 Firebase 설정(Firestore, 익명 로그인)을 확인하세요.</p></div>`;
  }
})();
})();
</script>
</body>
</html>
